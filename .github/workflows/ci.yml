name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: python3 -m py_compile tools/share.py
      - name: Build with the fixture
        run: PROJECTS_DIR=tests/fixtures/projects pnpm build
      # Fails on any project that breaks the rules in lib/projects.ts.
      - name: Build the site
        run: pnpm build
      - name: Check the videos of changed projects
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          for slug in $(git diff --name-only "$BASE_SHA" HEAD -- projects | cut -d/ -f2 | sort -u); do
            [[ -f "projects/$slug/project.json" ]] || continue
            scripts/check-video.sh "projects/$slug" "$RUNNER_TEMP/$slug.mp4"
          done
